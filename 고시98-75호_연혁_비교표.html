9-15", "t": "[1992년 7월 1일 ~ 2013년 9월 15일 이전 건축허가분 종전기준 (구 3.1.6(13))]\n3.1.6(13) 정전시에 램프중심부로부터 2m 떨어진 수직면상에서 측정하여 1Lux 이상의 조도를 확보할 수 있는 예비조명장치.\n다만, 자동차용 엘리베이터와 카 내에 조작반이 없는 화물용 엘리베이터의 경우에는 그러하지 아니하다.\n4.1.2(11) 정전시에 램프중심부로부터 2m 떨어진 수직면상의 조도를 1Lux 이상으로 비출 수 있는 예비조명장치의 작동상태는\n양호하여야 한다. 다만, 자동차용 엘리베이터와 카 내에 조작반이 없는 화물용 엘리베이터의 경우에는 그러하지 아니하다."}, {"s": 0.17, "id": "1.4.2-다", "e": "1992-07-01", "x": "1997-08-18", "t": "[1992년 7월 1일 ~ 1997년 8월 18일 이전 건축허가분 종전기준 (구 3.1.6(13))]\n3.1.6(13) 정전시에 램프중심부로부터 2m 떨어진 수직면상에서 측정하여 1 lux 이상의 조도를 확보할 수 있는 예비조명장치가 있어야 한다. 다만, 자동차용 엘리베이터와 카 내에 조작반이 없는 화물용 엘리베이터의 경우에는 그러하지 아니하다."}, {"s": 0.17, "id": "1.4.1-마", "e": "1992-07-01", "x": "2003-06-18", "t": "[1992년 7월 1일 ~ 2003년 6월 18일 이전 건축허가분 종전기준 (구 3.1.6(13))]\n3.1.6(13) 정전시에 램프중심부로부터 2m 떨어진 수직면상에서 측정하여 1 lux 이상의 조도를 확보할 수 있는 예비조명장치가 있어야 한다. 다만, 자동차용 엘리베이터와 카 내에 조작반이 없는 화물용 엘리베이터의 경우에는 그러하지 아니하다."}]}, {"n": 2, "d": "1992-07-01", "ref": "4.2.3(3)", "t": "카 위에서 운전조작하는 경우에 있어서 꼭대기부분 안전거리를 1.2m 이상을 확보하고, 그 이상의 카의 상승을 자동적으로 제어하여 정지시키는 장치의 작동상태는 양호하여야 한다. 다만, 카 천장이 없는 자동차용 엘리베이터의 경우에는 그러하지 아니하다.", "hyd": true, "c": [{"s": 0.28, "id": "7.3.2", "e": "1999-09-03", "x": "2013-09-15", "t": "3.1.2(5) 승강장문의 유효개구부의 폭은 0.8m 이상, 유효개구부의 높이는 2m 이상이어야 한다. 다만, 화물용 엘리베이터의 경우에는 그러하지 아니하다.\n4.1.2(3) 승강장문의 개폐상태 및 잠금장치의 작동상태는 양호하여야 한다."}, {"s": 0.28, "id": "7.3.1", "e": "1999-09-03", "x": "2013-09-15", "t": "3.1.2(5) 승강장문의 유효개구부의 폭은 0.8m 이상, 유효개구부의 높이는 2m 이상이어야 한다. 다만, 화물용 엘리베이터의 경우에는 그러하지 아니하다.\n4.1.2(3) 승강장문의 개폐상태 및 잠금장치의 작동상태는 양호하여야 한다."}, {"s": 0.27, "id": "16.3.1", "e": "1992-07-01", "x": "2013-09-15", "t": "[1992년 7월 1일 ~ 2013년 9월 15일 이전 건축허가분 종전기준 (구 4.1.2(5))]\n4.1.2(5) 외부와 연결하는 통화장치의 작동상태는 양호하여야 한다. 다만, 카 내에 조작반이 없는 화물용 엘리베이터의 경우에는\n그러하지 아니하다."}]}, {"n": 3, "d": "1992-07-01", "ref": "4.2.3(4)", "t": "카를 최상층에서 미속으로 상승시켜 플런저가 이탈방지장치로 정지했을 때 꼭대기부분틈새는 다음 수치 이상이어야 한다. 직접식 : 60cm,    간접식 : ({60+ V^2 over 706})cm", "hyd": true, "c": [{"s": 0.11, "id": "6.5.7.2", "e": "1992-07-01", "x": "2013-09-15", "t": "[1992년 7월 1일 ~ 2013년 9월 15일 이전 건축허가분 종전기준]\n[전기식]\n3.1.3(7) 꼭대기틈새 및 피트깊이는 다음 각항의 기준에 적합하여야 한다.\n① 꼭대기틈새는 카를 최상층에 정지시켜 놓은 상태에서 카의 상부체대와 승강로 천장부와의 수직거리를 측정하여 표 1에서\n규정한 수치 이상이어야 한다. 이 경우 카 위의 여러가지 장치중에서 가장 위로 돌출된 것이 승강로 천장부 또는 천장\n보다 돌출된 것(고정보 등)과 접촉되지 않아야 한다.\n표 1 < 2004년 12월 1일부터 시행 >\n정격속도(m/min)                꼭대기틈새(m)              피트깊이(m)\n45 이하                       1 . 2              1 . 2\n45 초과～ 60 이하                   1 . 4              1 ."}, {"s": 0.1, "id": "1.3.2-가", "e": "1992-07-01", "x": "1997-08-18", "t": "[1992년 7월 1일 ~ 1997년 8월 18일 이전 건축허가분 종전기준 (구 3.1.3(7)①)]\n3.1.3(7)① 꼭대기틈새는 카를 최상층에 정지시켜 놓은 상태에서 카의 상부체대와 승강로 천장부와의 수직거리를 측정하여 표 1에서 규정한 수치 이상이어야 한다. 이 경우 카 위의 여러 장치 중에서 가장 위로 돌출된 것이 승강로 천장부 또는 천장보다 돌출된 것(고정보 등)과 접촉되지 않아야 한다.\n(행정안전부고시 제2009-67호 제3.1.3(7)①, 1992년 7월 1일 이후 건축허가분부터 적용)"}, {"s": 0.08, "id": "13.3.2.3.1", "e": "1992-07-01", "x": "2013-09-15", "t": "[1992년 7월 1일 ~ 2013년 9월 15일 이전 건축허가분 종전기준]\n[유압식]\n3.2.6(4) 실린더로부터 플런저의 이탈을 방지하기 위한 장치\n3.2.6(13) 간접식 유압엘리베이터에 있어서 (4)에서 규정한 장치가 작동하기 전에 플런저의 상승을 자동적으로 제어하여 정지시키는\n장치\n4.2.3(5) 간접식 유압 엘리베이터의 잭에는 플런저 이탈방지장치가 닿기전에 작동하는 정지스위치가 설치되어 있고, 설치 및\n작동상태는 양호하여야 한다."}]}, {"n": 4, "d": "1994-06-01", "ref": "4.1.5(7)1", "t": "카 바닥 앞부분의 아랫방향으로 출입구의 전폭에 걸쳐 수직높이가 540mm 이상인 보호판이 견고하게 설치되어 있어야 한다.", "hyd": false, "c": [{"s": 0.41, "id": "1.4.1-사", "e": "2013-09-15", "x": "2019-03-28", "t": "[2013년 9월 15일 ~ 2019년 3월 28일 이전 건축허가분 종전기준 (구 4.1.5(7))]\n4.1.5(7) 승객용 등 엘리베이터의 보호판(에이프런)은 카 바닥 앞부분의 아랫방향으로 출입구의 전폭에 걸쳐 수직높이가 540㎜ 이상인 보호판이 견고하게 설치되어 있어야 한다. (행정안전부고시 제2009-67호 제4.1.5(7))"}, {"s": 0.4, "id": "8.5.1", "e": "1994-06-01", "x": "2013-09-15", "t": "[1994년 6월 1일 ~ 2013년 9월 15일 이전 건축허가분 종전기준 (구 4.1.5(7))]\n4.1.5(7) 승객용, 침대용, 승객·화물용, 비상용, 장애인용 및 전망용 엘리베이터에 설치되는 보호판(에이프런)은 카 바닥 앞부분의 아랫방향으로 출입구의 전폭에 걸쳐 수직높이가 540㎜ 이상인 보호판이 견고하게 설치되어 있어야 한다."}, {"s": 0.22, "id": "8.7.4", "e": "1995-06-07", "x": "2013-09-15", "t": "[1995년 6월 7일 ~ 2013년 9월 15일 이전 건축허가분 종전기준 (구 4.1.3(20))]\n4.1.3(20) 카 위의 출입구를 제외한 전둘레에는 카 위 바닥면에서 수직높이가 60㎝ 이상인 보호난간이 견고하게 설치되어 있어야 한다."}]}, {"n": 5, "d": "1995-06-07", "ref": "3.1.3(12)1", "t": "", "hyd": false, "c": []}, {"n": 6, "d": "1995-06-07", "ref": "4.1.1(1)7", "t": "권상기가 설치되어 있는 곳에는 비상시 사용할 수 있는 권상기의 브레이크 개방레버와 수동핸들을 갖추고 있어야 한다. 다만, 플라이휠이 설치되어 있는 경우에는 플라이휠을 수동핸들로 간주할 수 있다. 또한, 브레이크를 수동으로 개방할 수 없는 경우에는 비상전원에 의하여 브레이크를 개방할 수 있는 장치를 설치하여야 하며, 그 작동이 연속적이어서는 아니된다.", "hyd": false, "c": [{"s": 0.73, "id": "13.2.2.2.7", "e": "1995-06-07", "x": "2013-09-15", "t": "[1995년 6월 7일 ~ 2013년 9월 15일 이전 건축허가분 종전기준 (구 4.1.1(1)⑦)]\n[로프식]\n4.1.1(1)⑦ 권상기가 설치되어 있는 곳에는 비상시 사용할 수 있는 권상기의 브레이크 개방레버와 수동핸들을 갖추고 있어야 한다. 다만, 플라이휠이 설치되어 있는 경우에는 플라이휠을 수동핸들로 간주할 수 있다. 또한, 브레이크를 수동으로 개방할 수 없는 경우에는 비상전원에 의하여 브레이크를 개방할 수 있는 장치를 설치하여야 하며, 그 작동이 연속적이어서는 아니된다."}, {"s": 0.49, "id": "13.2.3.1", "e": "1995-06-07", "x": "2013-09-15", "t": "[1995년 6월 7일 ~ 2013년 9월 15일 이전 건축허가분 종전기준 (구 4.1.1(1)⑦⑧)]\n[로프식]\n4.1.1(1)⑦ 권상기가 설치되어 있는 곳에는 비상시 사용할 수 있는 권상기의 브레이크 개방레버와 수동핸들을 갖추고 있어야 한다. 플라이휠이 설치된 경우에는 수동핸들로 간주할 수 있다. 브레이크를 수동으로 개방할 수 없는 경우에는 비상전원에 의하여 브레이크를 개방할 수 있는 장치를 설치하여야 하며, 그 작동이 연속적이어서는 아니된다.\n4.1.1(1)⑧ 비상구출작업을 위하여 수동조작 등을 할 경우에는 카가 유도하는 승강장에 정확히 도착하였는지를 조작자가 확인할 수 있는 조치가 되어 있어야 한다."}, {"s": 0.12, "id": "6.6.3.2.4", "e": "2003-06-18", "x": "2013-09-15", "t": "[2003년 6월 18일 ~ 2013년 9월 15일 이전 건축허가분 종전기준 (구 3.1.5(9)②)]\n3.1.5(9)② 계단은 불연재료로 설치하여야 하고, 발판·난간 및 경사가 있어야 하며, 계단의 폭은 0.7m 이상이어야 한다. 다만, 위의 조건을 만족하는 사다리(원형사다리 포함)는 계단으로 간주할 수 있으며, 기계실 바닥까지의 높이가 1.5m 미만인 경우에는 수직사다리를 설치할 수 있다. 또한, 기계실 바닥의 높이차가 45㎝를 초과하는 경우에도 계단 또는 사다리를 설치하여야 한다."}]}, {"n": 7, "d": "1995-06-07", "ref": "4.1.1(1)8", "t": "비상구출작업을 위하여 수권조작 등을 할 경우에는 카가 유도하는 승강장에 정확히 도착하였는지를 조작자가 확인할 수 있는 조치가 되어 있어야 한다.", "hyd": false, "c": [{"s": 0.3, "id": "13.2.3.1", "e": "1995-06-07", "x": "2013-09-15", "t": "[1995년 6월 7일 ~ 2013년 9월 15일 이전 건축허가분 종전기준 (구 4.1.1(1)⑦⑧)]\n[로프식]\n4.1.1(1)⑦ 권상기가 설치되어 있는 곳에는 비상시 사용할 수 있는 권상기의 브레이크 개방레버와 수동핸들을 갖추고 있어야 한다. 플라이휠이 설치된 경우에는 수동핸들로 간주할 수 있다. 브레이크를 수동으로 개방할 수 없는 경우에는 비상전원에 의하여 브레이크를 개방할 수 있는 장치를 설치하여야 하며, 그 작동이 연속적이어서는 아니된다.\n4.1.1(1)⑧ 비상구출작업을 위하여 수동조작 등을 할 경우에는 카가 유도하는 승강장에 정확히 도착하였는지를 조작자가 확인할 수 있는 조치가 되어 있어야 한다."}, {"s": 0.14, "id": "7.7.3.1", "e": "1997-08-18", "x": "2013-09-15", "t": "3.1.2(3) 승강장문에는 비상키로 잠금을 해제할 수 있는 장치가 있어야 한다.\n4.1.2(3) 잠금장치의 작동상태는 양호하여야 한다."}, {"s": 0.14, "id": "1.4.4-바", "e": "1997-08-18", "x": "2013-09-15", "t": "3.1.2(3) 승강장문에는 비상키로 잠금을 해제할 수 있는 장치가 있어야 한다.\n4.1.2(3) 잠금장치의 작동상태는 양호하여야 한다."}]}, {"n": 8, "d": "1995-06-07", "ref": "4.1.1(1)9", "t": "카 내와 연결하는 통화장치의 작동상태는 양호하여야 한다. 다만, 카내에 조작반이 없는 화물용 엘리베이터의 경우에는 그러하지 아니하다. 기계실은 누수가 없이 청결하여야 한다. (2) 수전반·주개폐기·제어반·전기배관 및 배선", "hyd": false, "c": [{"s": 0.47, "id": "16.3.2", "e": "1995-06-07", "x": "2013-09-15", "t": "[1995년 6월 7일 ~ 2013년 9월 15일 이전 건축허가분 종전기준 (구 4.1.1(1)⑨)]\n4.1.1(1)⑨ 카 내와 연결하는 통화장치의 작동상태는 양호하여야 한다. 다만, 카 내에 조작반이 없는 화물용 엘리베이터의 경우에는 그러하지 아니하다."}, {"s": 0.45, "id": "16.3.1", "e": "1992-07-01", "x": "2013-09-15", "t": "[1992년 7월 1일 ~ 2013년 9월 15일 이전 건축허가분 종전기준 (구 4.1.2(5))]\n4.1.2(5) 외부와 연결하는 통화장치의 작동상태는 양호하여야 한다. 다만, 카 내에 조작반이 없는 화물용 엘리베이터의 경우에는\n그러하지 아니하다."}, {"s": 0.3, "id": "7.3.2", "e": "1999-09-03", "x": "2013-09-15", "t": "3.1.2(5) 승강장문의 유효개구부의 폭은 0.8m 이상, 유효개구부의 높이는 2m 이상이어야 한다. 다만, 화물용 엘리베이터의 경우에는 그러하지 아니하다.\n4.1.2(3) 승강장문의 개폐상태 및 잠금장치의 작동상태는 양호하여야 한다."}]}, {"n": 9, "d": "1995-06-07", "ref": "4.1.3(20)", "t": "", "hyd": false, "c": []}, {"n": 10, "d": "1995-06-07", "ref": "4.1.5(2)", "t": "엘리베이터를 사용하는 모든 승강장에는 비상해제장치를 설치하여야 하고, 특수한 키를 사용하지 않으면 문을 열 수 없어야 한다.", "hyd": false, "c": [{"s": 0.41, "id": "7.8.1", "e": "1999-01-14", "x": "2008-09-10", "t": "[1999년 1월 14일 ~ 2008년 9월 10일 이전 건축허가분 종전기준 (구 3.1.6(2)/4.1.5(2))]\n3.1.6(2) 카가 정지하고 있지 않은 층에서는 특수한 키를 사용하지 않으면 밖에서 승강로의 출입문을 열 수 없도록 하는 장치\n4.1.5(2) 엘리베이터를 사용하는 모든 승강장에는 비상해제장치를 설치하여야 하고, 카가 정지하고 있지 않은 층에서는 특수한 키를 사용하지 않으면 문을 열 수 없어야 한다."}, {"s": 0.18, "id": "7.9.3", "e": "2008-09-10", "x": "2008-11-07", "t": "[2008년 9월 10일 ~ 2008년 11월 7일 이전 건축허가분 종전기준 (구 3.1.6(2))]\n3.1.6(2) 카가 정지하고 있지 않은 층에서는 특수한 키를 사용하지 않으면 밖에서 승강로의 출입문을 열 수 없도록 하는 장치"}, {"s": 0.16, "id": "5.6.2", "e": "1997-08-18", "x": "2013-09-15", "t": "3.1.1(1) 승강로의 구조 및 설비\n① 승강로는 견고한 벽, 천장 및 바닥으로 구획하여야 하고 그 내부에는 엘리베이터와 관계없는 배관, 배선 또는 기타 이질설비를 설치하지 않아야 한다.\n4.1.2(1) 승강로의 구조 및 설비는 견고하고 양호한 상태에 있어야 한다."}]}, {"n": 11, "d": "1995-06-07", "ref": "4.1.5(3)1", "t": "문닫힘 동작시 사람 또는 물건이 문에 끼이는 경우에 문이 반전하여 열리도록 하는 문닫힘안전장치(세이프티슈·관전장치·초음파장치등)가 카 문이나 승강장 문 또는 양쪽 문 모두에 설치되어 있고, 작동상태는 양호하여야 한다.", "hyd": false, "c": [{"s": 0.68, "id": "7.6.2.2.1", "e": "1995-06-07", "x": "1999-01-14", "t": "[1995년 6월 7일 ~ 1999년 1월 14일 이전 건축허가분 종전기준 (구 4.1.5(3)①)]\n4.1.5(3)① 문닫힘 동작시 사람 또는 물건이 문에 끼이는 경우에 문이 반전하여 열리도록 하는 문닫힘안전장치(세이프티슈·광전장치·초음파장치 등)가 카 문이나 승강장 문 또는 양쪽 문 모두에 설치되어 있고, 작동상태는 양호하여야 한다."}, {"s": 0.18, "id": "1.4.4-가", "e": "1997-08-18", "x": "2003-06-18", "t": "3.1.2(6) 동력 작동식 승강장문에는 안전장치가 있어야 한다.\n4.1.2(3) 승강장문의 작동상태는 양호하여야 한다."}, {"s": 0.17, "id": "1.4.3-다", "e": "1995-06-07", "x": "2013-09-15", "t": "[1995년 6월 7일 ~ 2013년 9월 15일 이전 건축허가분 종전기준 (구 4.1.5(3))]\n4.1.5(3) 동력으로 작동되는 문의 닫힘 동작 시 사람 또는 물건이 끼이지 않도록 적절한 안전장치가 설치되어야 한다."}]}, {"n": 12, "d": "1995-06-07", "ref": "4.1.5(8)", "t": "카 도어록을 설치하였을 경우에 설치상태는 견고하여야 한다.", "hyd": false, "c": [{"s": 0.35, "id": "9.1.5", "e": "1992-07-01", "x": "1997-08-18", "t": "4.1.3(13) 주로프의 설치상태는 견고하여야 한다."}, {"s": 0.28, "id": "9.9.1", "e": "1992-07-01", "x": "1997-08-18", "t": "4.1.3(16) 조속기의 설치상태는 견고하고, 작동상태는 양호하여야 한다."}, {"s": 0.28, "id": "8.17.4", "e": "1992-07-01", "x": "1997-08-18", "t": "4.1.3(7) 카 내 조명의 설치상태는 견고하고, 작동상태는 양호하여야 한다."}]}, {"n": 13, "d": "1995-06-07", "ref": "4.1.5(9)1", "t": "비상용 표지의 재질은 알루미늄판·스테인레스판·아크릴판 또는 스티커로 하여야 한다.", "hyd": false, "c": [{"s": 0.1, "id": "1.4.4-사", "e": "1997-08-18", "x": "2013-09-15", "t": "4.1.2(3) 비상 잠금해제 장치의 상태는 양호하여야 한다."}, {"s": 0.08, "id": "15.12", "e": "1992-07-01", "x": "1997-08-18", "t": "4.1.3(10) 비상통화장치의 설치상태는 견고하고, 작동상태는 양호하여야 한다."}, {"s": 0.08, "id": "14.2.3.3", "e": "1992-07-01", "x": "1997-08-18", "t": "4.1.3(10) 비상통화장치의 설치상태는 견고하고, 작동상태는 양호하여야 한다."}]}, {"n": 14, "d": "1997-01-01", "ref": "3.1.3(3)", "t": "승강로의 출입구에 접한 승강로비 또는 이와 유사한 부분은 엘리베이터 전용으로 하고, 당해부분의 벽 또는 천장이 실내에 접하는 부분의 마감은 준불연재료로 만든 것으로 하여야 한다.", "hyd": false, "c": [{"s": 0.39, "id": "6.5.2.1", "e": "1997-08-18", "x": "1999-09-03", "t": "[1997년 8월 18일 ~ 1999년 9월 3일 이전 건축허가분 종전기준 (구 3.1.3(2) + 3.1.3(3))]\n3.1.3(2) 승강로의 벽 또는 울 및 출입문은 불연재료로 만들거나 씌워야 한다. 다만, 승강로의 벽 일부에 유리를 사용할 경우에는 한국산업규격의 망유리·강화유리·접합유리 및 복층유리(16㎜ 이상)와 동등 이상의 것을 사용하여야 한다.\n3.1.3(3) 승강로의 출입구에 접한 승강로비 또는 이와 유사한 부분은 엘리베이터 전용으로 하고, 당해부분의 벽 또는 천장이 실내에 접하는 부분의 마감은 준불연재료로 하며, 그 하부를 불연재료로 만든 것으로 하여야 한다."}, {"s": 0.12, "id": "5.1.6", "e": "1997-08-18", "x": "2013-09-15", "t": "3.1.1(1) 승강로는 엘리베이터 관련 설비 이외의 것이 없도록 하여야 한다.\n4.1.2(1) 승강로의 구조 및 설비는 견고하고 양호한 상태에 있어야 한다."}, {"s": 0.12, "id": "5.1.5", "e": "1997-08-18", "x": "2013-09-15", "t": "3.1.1(1) 승강로는 엘리베이터 관련 설비 이외의 것이 없도록 하여야 한다.\n4.1.2(1) 승강로의 구조 및 설비는 견고하고 양호한 상태에 있어야 한다."}]}, {"n": 15, "d": "1997-01-01", "ref": "3.1.3(6)", "t": "카 바닥 앞부분과 승강로 벽과의 수평거리는 다음 각 항의 기준에 적합하여야 한다. 다만, 화물용 엘리베이터의 경우에는 그러하지 아니하다.", "hyd": false, "c": [{"s": 0.28, "id": "7.4.1", "e": "1992-07-01", "x": "2013-09-15", "t": "[1992년 7월 1일 ~ 2013년 9월 15일 이전 건축허가분 종전기준 (구 3.1.3(5))]\n3.1.3(5) 승강장 출입구 바닥 앞부분과 카 바닥 앞부분과의 틈의 너비는 4㎝ 이하로 하여야 한다.\n4.1.2(10) 승강장 출입구 바닥 앞부분과 카 바닥 앞부분과의 틈의 너비는 4㎝ 이하이어야 한다. 다만, 장애인용 엘리베이터의\n경우에는 그러하지 아니하다."}, {"s": 0.27, "id": "8.6.2", "e": "1997-08-18", "x": "2013-09-15", "t": "[1997년 8월 18일 ~ 2013년 9월 15일 이전 건축허가분 종전기준 (구 3.1.2(4))]\n3.1.2(4) 비상시 외부에서 구출할 수 있는 비상구출구는 다음 각항의 기준에 적합하여야 한다. 다만, 자동차용 엘리베이터와\n카 내에 조작반이 없는 화물용 엘리베이터의 경우에는 그러하지 아니하다.\n② 비상시 승강기(전동 덤웨이터를 제외한다)에는 외부에서 구출할 수 있는 비상구출구를 설치하여야 한다."}, {"s": 0.27, "id": "8.6.1", "e": "1997-08-18", "x": "2013-09-15", "t": "[1997년 8월 18일 ~ 2013년 9월 15일 이전 건축허가분 종전기준 (구 3.1.2(4))]\n3.1.2(4) 비상시 외부에서 구출할 수 있는 비상구출구는 다음 각항의 기준에 적합하여야 한다. 다만, 자동차용 엘리베이터와\n카 내에 조작반이 없는 화물용 엘리베이터의 경우에는 그러하지 아니하다.\n① 비상시 승강기(전동 덤웨이터를 제외한다)에는 외부에서 구출할 수 있는 비상구출구를 설치하여야 한다."}]}, {"n": 16, "d": "1997-01-01", "ref": "3.1.10(7)", "t": "엘리베이터 내부의 후면에는 출입문의 개폐여부를 확인할 수 있는 견고한 재질의 거울 등을 부착하여야 한다. 다만, 엘리베이터의 유효 바닥면적이 1.4m×1.4m이상인 경우에는 그러하지 아니한다.", "hyd": false, "c": [{"s": 0.23, "id": "7.3.2", "e": "1999-09-03", "x": "2013-09-15", "t": "3.1.2(5) 승강장문의 유효개구부의 폭은 0.8m 이상, 유효개구부의 높이는 2m 이상이어야 한다. 다만, 화물용 엘리베이터의 경우에는 그러하지 아니하다.\n4.1.2(3) 승강장문의 개폐상태 및 잠금장치의 작동상태는 양호하여야 한다."}, {"s": 0.23, "id": "7.3.1", "e": "1999-09-03", "x": "2013-09-15", "t": "3.1.2(5) 승강장문의 유효개구부의 폭은 0.8m 이상, 유효개구부의 높이는 2m 이상이어야 한다. 다만, 화물용 엘리베이터의 경우에는 그러하지 아니하다.\n4.1.2(3) 승강장문의 개폐상태 및 잠금장치의 작동상태는 양호하여야 한다."}, {"s": 0.16, "id": "8.5.2", "e": "1994-06-01", "x": "2013-09-15", "t": "[1994년 6월 1일 ~ 2013년 9월 15일 이전 건축허가분 종전기준 (구 4.1.5(7))]\n4.1.5(7) 보호판(에이프런)의 수직 부분 높이는 540㎜ 이상이어야 한다. 다만, 주택용 엘리베이터의 경우에는 그러하지 아니할 수 있다."}]}, {"n": 17, "d": "1997-01-01", "ref": "4.1.1(3)3", "t": "", "hyd": false, "c": []}, {"n": 18, "d": "1997-01-01", "ref": "4.1.2(1)", "t": "카 바닥 앞부분과 승강로 벽과의 수평거리(화물용 엘리베이터는 제외)는 125mm 이하를 유지하고 있어야 하며, 출입구가 2개인 엘리베이터의 경우에는 각각의 출입구쪽 카 바닥 앞부분과 승강로 벽과의 수평거리는 125mm 이하를 유지하고 있어야 한다.", "hyd": false, "c": [{"s": 0.28, "id": "6.5.3.1", "e": "1994-06-01", "x": "1997-01-01", "t": "[1994년 6월 1일 ~ 1997년 1월 1일 이전 건축허가분 종전기준 (구 3.1.3(6)/4.1.2(1))]\n3.1.3(6)[4.1.2(1)] 승객용, 침대용, 승객·화물용 엘리베이터에 있어서는 카바닥 앞부분과 승강로 벽과의 수평거리는 125㎜ 이하이어야 한다."}, {"s": 0.18, "id": "7.4.1", "e": "1992-07-01", "x": "2013-09-15", "t": "[1992년 7월 1일 ~ 2013년 9월 15일 이전 건축허가분 종전기준 (구 3.1.3(5))]\n3.1.3(5) 승강장 출입구 바닥 앞부분과 카 바닥 앞부분과의 틈의 너비는 4㎝ 이하로 하여야 한다.\n4.1.2(10) 승강장 출입구 바닥 앞부분과 카 바닥 앞부분과의 틈의 너비는 4㎝ 이하이어야 한다. 다만, 장애인용 엘리베이터의\n경우에는 그러하지 아니하다."}, {"s": 0.15, "id": "1.4.3-라", "e": "1997-08-18", "x": "2013-09-15", "t": "3.1.2(7) 승강장 문턱과 카 문턱 사이의 수평거리는 35mm 이하이어야 한다.\n4.1.2(5) 승강장 문턱 및 카 문턱의 상태는 양호하여야 한다."}]}, {"n": 19, "d": "1997-01-01", "ref": "4.1.4(16)", "t": "", "hyd": false, "c": []}, {"n": 20, "d": "1997-01-01", "ref": "4.1.5(3)2", "t": "비상용 엘리베이터의 경우에는 비상호출운전중 불특정 다수의 승객이 사용할 수 있으므로 비상호출운정중에도 기능이 유효하도록 세이프티슈방식의 문닫힘안전장치가 설치되어 있거나, 비상호출운전중 화재로 인한 연기 등에 의해서도 기능이 저하되지 않는 관전장치 또는 초음파장치 등의 문닫힘안전장치가 설치되어 있어야 한다.", "hyd": false, "c": [{"s": 0.31, "id": "17.2.8.7", "e": "1997-01-01", "x": "2013-09-15", "t": "[1997년 1월 1일 ~ 2013년 9월 15일 이전 건축허가분 종전기준 (구 4.1.5(3)② + 4.1.2(8))]\n[로프식]\n4.1.5(3)② 비상용 엘리베이터의 경우 비상호출운전 중에도 기능이 유효하도록 세이프티슈방식 또는 광전장치·초음파장치 등의 문닫힘안전장치가 설치되어 있어야 한다.\n4.1.2(8) 비상용 엘리베이터에 있어서 1차소방스위치(키 스위치) 조작 후 ①~④ 동작 확인 (1997년 이전과 동일)"}, {"s": 0.13, "id": "17.2.4.3", "e": "1992-07-01", "x": "2013-09-15", "t": "[1992년 7월 1일 ~ 2013년 9월 15일 이전 건축허가분 종전기준]\n[로프식]\n4.1.3(14) 비상용 엘리베이터에 있어서 소방활동에 사용된 물이 승강장 문 틈새에서 카 위로 떨어질 수 있으므로 카 및 승강로의\n각 전기장치는 다음 각항의 조치가 되어 있어야 한다.\n① 조명기구는 안정기가 침수되지 않는 위치에 설치되어 있거나 안정기가 침수될 때 엘리베이터의 운전에 저해를 주지 않아야 한다.\n② 경보장치는 방적처리(물을 제거하기 위한 커버 및 물빼기 구멍 등에 의한 처리)를 하여야 한다.\n③ 천정팬에는 방적커버가 설치되어 있거나 비상운전시 분리되어야 하고, 방적처리를 하지 않은 경우에는 천정팬이 침수될 때\n차단되어 엘리베이터 운전에 저해를 주지 않아야 한다.\n④ 비상구출구스위치는 비상운전시 분리되어야 한다.\n⑤ 카 및 승강장 문의 도어스위치는 방적처리 및 2차소방운전시 분리되어"}, {"s": 0.12, "id": "7.6.2.2.1", "e": "1995-06-07", "x": "1999-01-14", "t": "[1995년 6월 7일 ~ 1999년 1월 14일 이전 건축허가분 종전기준 (구 4.1.5(3)①)]\n4.1.5(3)① 문닫힘 동작시 사람 또는 물건이 문에 끼이는 경우에 문이 반전하여 열리도록 하는 문닫힘안전장치(세이프티슈·광전장치·초음파장치 등)가 카 문이나 승강장 문 또는 양쪽 문 모두에 설치되어 있고, 작동상태는 양호하여야 한다."}]}, {"n": 21, "d": "1998-05-09", "ref": "3.1.2(4)1", "t": "카 천장에 설치된 비상구출구는 카 위에서는 공구등을 사용하지 않고 간단한 조작에 의해 쉽게 열 수 있어야 하나, 카 내에서는 열 수 없도록 잠금장치를 갖추어야 하며, 승객의 구출 활동에 장애가 없도록 충분한 공간이 확보되는 위치에 설치하고, 크기는 작은쪽 변의 길이가 0.4m이상, 면적은 0.2㎡이상으로 하여야 한다.", "hyd": false, "c": [{"s": 0.11, "id": "7.8.1", "e": "2008-09-10", "x": "2008-11-07", "t": "[2008년 9월 10일 ~ 2008년 11월 7일 이전 건축허가분 종전기준 (구 3.1.6(2)/4.1.5(2))]\n3.1.6(2) 카가 정지하고 있지 않은 층에서는 특수한 키를 사용하지 않으면 밖에서 승강로의 출입문을 열 수 없도록 하는 장치를 설치하여야 하며, 승강장 출입문을 개방하기 위한 장치는 그림 4에 규정된 삼각형의 잠금해제장치 규격에 적합하여야 한다.\n4.1.5(2) 엘리베이터를 사용하는 모든 승강장에는 비상해제장치를 설치하여야 하고, 카가 정지하고 있지 않은 층에서는 특수한 키를 사용하지 않으면 문을 열 수 없어야 한다."}, {"s": 0.11, "id": "8.7.1", "e": "2013-09-15", "x": null, "t": "[2013년 9월 15일 이후 건축허가분 종전기준 (구 8.13.1 + 8.13.2)]\n8.13.1 카 지붕은 어떤 위치에서든지 0.2 m × 0.2 m의 면적에 1,000 N으로 각각 계산한 두 사람의 무게를 영구적인 변형 없이 견딜 수 있어야 한다.\n8.13.2 카 지붕은 사람이 서 있을 수 있는 0.12 ㎡ 이상의 유효 면적이 확보되어야 하고, 작은 변의 길이는 0.25 m 이상이어야 한다."}, {"s": 0.11, "id": "8.6.4", "e": "1992-07-01", "x": "2013-09-15", "t": "[1992년 7월 1일 ~ 2013년 9월 15일 이전 건축허가분 종전기준 (구 3.1.2(4))]\n3.1.2(4) 비상시 외부에서 구출할 수 있는 비상구출구는 다음 각항의 기준에 적합하여야 한다. 다만, 자동차용 엘리베이터와\n카 내에 조작반이 없는 화물용 엘리베이터의 경우에는 그러하지 아니하다.\n③ 비상구출구를 열었을 때에는 비상구출구스위치가 작동하여 카가 움직이지 않아야 한다.\n4.1.3(1) 비상구출구는 카 밖에서 간단한 조작으로 열 수 있어야 한다. 또한, 비상구출구스위치의 설치상태는 견고하고, 작동상태는\n양호하여야 한다. 다만, 자동차용 엘리베이터와 카 내에 조작반이 없는 화물용 엘리베이터의 경우에는 그러하지 아니하다."}]}, {"n": 22, "d": "1998-05-09", "ref": "3.1.2(4)2", "t": "카 벽에 설치된 비상구출구는 카 안쪽으로만 열리고, 카 내부에서는 열쇠를 사용하지 않으면 열 수 없어야 하며, 크기는 폭 0.35m이상, 높이 1.5m이상으로 하여야한다.", "hyd": false, "c": [{"s": 0.16, "id": "8.6.2", "e": "2013-09-15", "x": null, "t": "[2013년 9월 15일 이후 건축허가분 종전기준 (구 8.12.3)]\n8.12.3 2대 이상의 엘리베이터가 동일 승강로에 설치되어 인접한 카에서 구출할 수 있도록 카 벽에 비상구출문이 설치될 수 있다. 다만, 서로 다른 카 사이의 수평거리는 0.75m 이하이어야 한다. 이 비상구출문의 크기는 폭 0.35m 이상, 높이 1.8m 이상이어야 한다."}, {"s": 0.14, "id": "7.8.1", "e": "1999-01-14", "x": "2008-09-10", "t": "[1999년 1월 14일 ~ 2008년 9월 10일 이전 건축허가분 종전기준 (구 3.1.6(2)/4.1.5(2))]\n3.1.6(2) 카가 정지하고 있지 않은 층에서는 특수한 키를 사용하지 않으면 밖에서 승강로의 출입문을 열 수 없도록 하는 장치\n4.1.5(2) 엘리베이터를 사용하는 모든 승강장에는 비상해제장치를 설치하여야 하고, 카가 정지하고 있지 않은 층에서는 특수한 키를 사용하지 않으면 문을 열 수 없어야 한다."}, {"s": 0.14, "id": "5.2.2.2.2", "e": "1997-08-18", "x": "2013-09-15", "t": "3.1.1(3) 승강로 내의 비상문은 다음 기준에 적합하여야 한다.\n유효 폭 0.35m 이상, 유효 높이 1.8m 이상이어야 한다. 열쇠로 잠글 수 있고 내부에서 열쇠 없이 열릴 수 있어야 한다.\n4.1.2(2) 비상문·점검문의 잠금장치 및 작동상태는 양호하여야 한다."}]}, {"n": 23, "d": "1998-05-09", "ref": "3.1.2(6)", "t": "카 내부치수 및 도어치수는 KS B 6830(승용엘리베이터와 승강로의 치수)에 따른다. 다만, 카 내부치수는 KS B 6830 또는 용도 및 적재하중을 고려한 최적 카 내부치수와 면적대비시 5%이내의 증가는 허용할 수 있다.", "hyd": false, "c": [{"s": 0.64, "id": "7.5.3.4", "e": "1997-08-18", "x": "2003-06-18", "t": "[1997년 8월 18일 ~ 2003년 6월 18일 이전 건축허가분 종전기준 (구 3.1.2(6))]\n3.1.2(6) 카 내부치수 및 도어치수는 KS B 6830(승용엘리베이터와 승강로의 치수)에 따른다. 다만, 카 내부치수는 KS S 6830 또는 용도 및 적재하중을 고려한 최적 카 내부치수와 면적대비 5% 이내의 증가는 허용할 수 있다."}, {"s": 0.64, "id": "7.2.1", "e": "1997-08-18", "x": "2003-06-18", "t": "[1997년 8월 18일 ~ 2003년 6월 18일 이전 건축허가분 종전기준 (구 3.1.2(6))]\n3.1.2(6) 카 내부치수 및 도어치수는 KS B 6830(승용엘리베이터와 승강로의 치수)에 따른다. 다만, 카 내부치수는 KS S 6830 또는 용도 및 적재하중을 고려한 최적 카 내부치수와 면적대비 5% 이내의 증가는 허용할 수 있다."}, {"s": 0.5, "id": "8.2.1.1", "e": "1997-08-18", "x": "2003-06-18", "t": "[1997년 8월 18일 ~ 2003년 6월 18일 이전 건축허가분 종전기준 (구 3.1.2(6))]\n3.1.2(6) 카 내부치수 및 도어치수는 KS B 6830에 따른다. 다만, 카 내부치수는 KS S 6830 또는 용도 및 적재하중을 고려한 최적 카 내부치수와 면적대비 5% 이내의 증가는 허용할 수 있다."}]}, {"n": 24, "d": "1998-05-09", "ref": "3.1.3(8)", "t": "승강로의 치수는 KS B 6830(승용엘리베이터와 승강로의 치수)에서 규정한 치수의 면적비율에 따른다.", "hyd": false, "c": [{"s": 0.34, "id": "8.2.1.1", "e": "1992-07-01", "x": "1997-08-18", "t": "[1992년 7월 1일 ~ 1997년 8월 18일 이전 건축허가분 종전기준 (구 3.1.2(6))]\n3.1.2(6) 카 내부의 치수 및 도어치수는 KS B 6830(승용엘리베이터와 승강로의 치수)에 따른다."}, {"s": 0.34, "id": "7.7.2.1", "e": "1992-07-01", "x": "1997-08-18", "t": "[1992년 7월 1일 ~ 1997년 8월 18일 이전 건축허가분 종전기준 (구 3.1.2(6))]\n3.1.2(6) 카 내부의 치수 및 도어치수는 KS B 6830(승용엘리베이터와 승강로의 치수)에 따른다."}, {"s": 0.34, "id": "7.6.2.3", "e": "1992-07-01", "x": "1997-08-18", "t": "[1992년 7월 1일 ~ 1997년 8월 18일 이전 건축허가분 종전기준 (구 3.1.2(6))]\n3.1.2(6) 카 내부의 치수 및 도어치수는 KS B 6830(승용엘리베이터와 승강로의 치수)에 따른다."}]}, {"n": 25, "d": "1998-05-09", "ref": "3.1.3(11)", "t": "", "hyd": false, "c": []}, {"n": 26, "d": "1998-05-09", "ref": "3.1.3(12)2", "t": "", "hyd": false, "c": []}, {"n": 27, "d": "1998-05-09", "ref": "3.1.3(13)", "t": "", "hyd": false, "c": []}, {"n": 28, "d": "1998-05-09", "ref": "3.1.5(3)", "t": "바닥면부터 천장 또는 보의 하부까지의 수직거리는 2m 이상으로 하여야 한다.", "hyd": false, "c": [{"s": 0.23, "id": "6.6.3.2.1", "e": "1999-01-14", "x": "2013-09-15", "t": "[1999년 1월 14일 ~ 2013년 9월 15일 이전 건축허가분 종전기준 (구 3.1.5(1)(3)/3.2.5(1)(2))]\n[로프식]\n3.1.5(1) 주요한 기기로부터 기둥이나 벽까지의 수평거리는 30㎝ 이상으로 하여야 한다. 다만, 기기의 배치 및 관리에 지장이 없는 경우에는 그러하지 아니하다.\n3.1.5(3) 바닥면부터 천장 또는 보의 하부까지의 수직거리는 2m 이상으로 하여야 한다. 다만, 기기의 배치 및 관리에 지장이 없는 경우에는 그러하지 아니하다.\n[유압식]\n3.2.5(1) 주요한 기기로부터 기둥이나 벽까지의 수평거리는 50㎝ 이상으로 하여야 한다.\n3.2.5(2) 바닥에서부터 천장이나 보의 하단까지의 수직거리는 2m 이상으로 하여야 한다."}, {"s": 0.15, "id": "1.3.2-가", "e": "1997-08-18", "x": "2013-09-15", "t": "3.1.1(2) 카가 최상층에 있을 때 카 상부와 천장 사이의 수직거리는 1.2m 이상이어야 한다.\n4.1.2(12) 피트 및 카 상부 공간은 양호한 상태에 있어야 한다."}, {"s": 0.15, "id": "1.3.5-다", "e": "1997-08-18", "x": "2013-09-15", "t": "3.1.1(1) 승강로는 견고한 벽, 천장 및 바닥으로 구획하여야 한다."}]}, {"n": 29, "d": "1998-05-09", "ref": "3.1.5(5)", "t": "기계실 천장에는 기기를 양정하기 위한 고리 등을 설치하여야 한다.", "hyd": false, "c": [{"s": 0.65, "id": "1.2.2.1-아", "e": "1997-08-18", "x": "2013-09-15", "t": "3.1.5(5) 기계실 천장에는 기기를 양정하기 위한 고리 등을 설치하여야 한다.\n※ 유압식 엘리베이터 제외"}, {"s": 0.39, "id": "6.1.7", "e": "1997-08-18", "x": "2013-09-15", "t": "[1997년 8월 18일 ~ 2013년 9월 15일 이전 건축허가분 종전기준 (구 3.1.5(5))]\n3.1.5(5) 기계실 천장에는 기기를 양정하기 위한 고리 등을 설치하여야 한다. (유압식 제외)"}, {"s": 0.15, "id": "5.6.1.2", "e": "1997-08-18", "x": "2013-09-15", "t": "3.1.1(6) 균형추의 운동구역에서 사람이 접근할 수 있는 부분에는 방호판을 설치하여야 한다."}]}, {"n": 30, "d": "1998-05-09", "ref": "3.1.5(6)", "t": "기계실의 유지관리에 지장이 없도록 조명 및 환기시설은 다음 각항의 기준에 적합하여야 한다.", "hyd": false, "c": [{"s": 0.24, "id": "1.2.2.1-바", "e": "1992-07-01", "x": "1997-08-18", "t": "3.1.5(6) 관리, 검사에 지장이 없도록 조명 및 환기는 적절하고, 실온은 원칙적으로 40℃ 이하를 유지하도록 하여야 한다.\n4.1.1(1)③ 관리, 검사에 지장이 없도록 조명 및 환기는 적절하고, 실온은 원칙적으로 40℃ 이하를 유지하도록 하여야 한다."}, {"s": 0.24, "id": "1.2.2.1-마", "e": "1992-07-01", "x": "1997-08-18", "t": "3.1.5(6) 관리, 검사에 지장이 없도록 조명 및 환기는 적절하고, 실온은 원칙적으로 40℃ 이하를 유지하도록 하여야 한다.\n4.1.1(1)③ 관리, 검사에 지장이 없도록 조명 및 환기는 적절하고, 실온은 원칙적으로 40℃ 이하를 유지하도록 하여야 한다."}, {"s": 0.23, "id": "1.2.1.2-가", "e": "1995-06-07", "x": "2013-09-15", "t": "[1995년 6월 7일 ~ 2013년 9월 15일 이전 건축허가분 종전기준 (구 3.1.3(12))]\n3.1.3(12) 피트에는 유지관리상 지장이 없도록 피트점검용 사다리 또는 출입구를 설치하여야 하며, 다음 각항의 기준에 적합하여야 한다."}]}, {"n": 31, "d": "1998-05-09", "ref": "3.1.5(8)", "t": "기계실의 바로 위층 또는 인접한 벽면에 물탱크실이 있을 경우에는 물이 범람하는 경우에 대비하여 충분한 침수방지조치를 하여야 한다.", "hyd": false, "c": [{"s": 0.11, "id": "6.6.3.2.4", "e": "2013-09-15", "x": null, "t": "[2013년 9월 15일 이후 건축허가분 종전기준 (구 6.3.3.4)]\n6.3.3.4 기계실 바닥에 0.5m를 초과하는 단차가 있을 경우에는 보호난간이 있는 계단 또는 발판이 있어야 한다."}, {"s": 0.09, "id": "1.2.2.1-마", "e": "1997-08-18", "x": "2004-12-01", "t": "3.1.5(6)② 자연환기하는 경우에 환기창 또는 갤러리 등의 합산한 크기는 기계실 바닥면적의 1/20 이상이어야 하고, 실온은 원칙적으로 40℃ 이하를 유지할 수 있어야 한다.\n4.1.1(1)③ 유지관리에 지장이 없도록 기계실의 조도는 기기가 배치된 바닥면에서 100Lux 이상이어야 하고, 환기는 적절하여야 하며, 실온은 원칙적으로 40℃ 이하를 유지하도록 하여야 한다."}, {"s": 0.09, "id": "9.6.1", "e": "1992-07-01", "x": "2013-09-15", "t": "[1992년 7월 1일 ~ 2013년 9월 15일 이전 건축허가분 종전기준]\n[로프식]\n4.1.4(11) 균형로프 또는 균형체인이 있는 경우에 설치상태는 견고하여야 한다."}]}, {"n": 32, "d": "1998-05-09", "ref": "3.1.5(9)", "t": "기계실로 가는 복도·계단 및 출입문 등은 다음 각항의 기준에 적합하여야 한다.", "hyd": false, "c": [{"s": 0.21, "id": "6.6.3.2.4", "e": "1997-08-18", "x": "2003-06-18", "t": "[1997년 8월 18일 ~ 2003년 6월 18일 이전 건축허가분 종전기준 (구 3.1.5(9))]\n3.1.5(9) 기계실로 가는 복도, 계단, 출입문 등은 유지관리상 지장이 없어야 한다.” 및 “출입구의 자물쇠의 시건장치는 양호하여야\n한다."}, {"s": 0.2, "id": "6.3.2", "e": "1992-07-01", "x": "1997-08-18", "t": "[1992년 7월 1일 ~ 1997년 8월 18일 이전 건축허가분 종전기준 (구 3.1.5(9))]\n3.1.5(9) 기계실로 가는 복도, 계단, 출입문 등은 유지관리상 지장이 없어야 한다.\n출입구의 자물쇠의 시건장치는 양호하여야 한다."}, {"s": 0.19, "id": "1.2.1.2-나", "e": "1997-08-18", "x": "2013-09-15", "t": "[1997년 8월 18일 이전 건축허가분 종전기준 (구 3.1.5(9), 4.1.1(1))]\n3.1.5(9) \"기계실로 가는 복도, 계단, 출입문 등은 유지관리상 지장이 없어야 한다.\"\n4.1.1(1) 기계실의 구조 및 설비 조항 적용"}]}, {"n": 33, "d": "1998-05-09", "ref": "3.1.6(15)", "t": "", "hyd": false, "c": []}, {"n": 34, "d": "1998-05-09", "ref": "3.1.8", "t": "", "hyd": false, "c": []}, {"n": 35, "d": "1998-05-09", "ref": "3.1.10(2)", "t": "엘리베이터 내부의 휠체어사용자용 조작반은 진입방향 우측면에 가로형으로 설치하고, 그 높이는 바닥면으로부터 0.85m내외로 하여야 한다. 다만, 승강기의 유효바닥면적이 1.4m×1.4m이상인 경우에는 진입방향 좌측면에 설치할 수 있다.", "hyd": false, "c": [{"s": 0.15, "id": "7.3.2", "e": "1999-09-03", "x": "2013-09-15", "t": "3.1.2(5) 승강장문의 유효개구부의 폭은 0.8m 이상, 유효개구부의 높이는 2m 이상이어야 한다. 다만, 화물용 엘리베이터의 경우에는 그러하지 아니하다.\n4.1.2(3) 승강장문의 개폐상태 및 잠금장치의 작동상태는 양호하여야 한다."}, {"s": 0.15, "id": "7.3.1", "e": "1999-09-03", "x": "2013-09-15", "t": "3.1.2(5) 승강장문의 유효개구부의 폭은 0.8m 이상, 유효개구부의 높이는 2m 이상이어야 한다. 다만, 화물용 엘리베이터의 경우에는 그러하지 아니하다.\n4.1.2(3) 승강장문의 개폐상태 및 잠금장치의 작동상태는 양호하여야 한다."}, {"s": 0.12, "id": "8.1.2", "e": "2013-09-15", "x": "2019-03-28", "t": "[2013년 9월 15일 ~ 2019년 3월 28일 이전 건축허가분 종전기준 (구 8.1.1)]\n8.1.1 카 내부의 유효 높이는 2 m 이상이어야 한다. 다만, 자동차용 엘리베이터는 제외한다."}]}, {"n": 36, "d": "1998-05-09", "ref": "3.1.10(9)", "t": "각 층의 승강장에는 엘리베이터의 도착여부를 표시하는 점멸등 및 음향신호장치를 설치하여야 하며, 엘리베이터 내부에는 도착층 및 운행상황을 표시하는 점멸등 및 음성신호장치를 설치하여야 한다. (10) 각층의 장애인용 엘리베이터 호출버턴의 0.3m 전면에는 점형블록을 설치하거나 시각장애인이 감지할 수 있도록 바닥재의 질감 등을 달리하여야 한다. (11) 카내 조작반 및 통화장치와 승강장의 호출버튼에는 점자표시판을 부착하여야 한다.", "hyd": false, "c": [{"s": 0.11, "id": "8.6.1", "e": "1992-07-01", "x": "1997-08-18", "t": "[1992년 7월 1일 ~ 1997년 8월 18일 이전 건축허가분 종전기준 (구 3.1.2(4)①)]\n3.1.2(4)① 비상시 승강기(전동 덤웨이터를 제외한다)에는 외부에서 구출할 수 있는 비상구출구를 설치하여야 한다. (자동차용 엘리베이터와 카 내 조작반 없는 화물용 제외)"}, {"s": 0.11, "id": "16.3.3", "e": "1992-07-01", "x": "2013-09-15", "t": "[1992년 7월 1일 ~ 2013년 9월 15일 이전 건축허가분 종전기준 (구 4.1.5(6))]\n4.1.5(6) 카 내와 외부의 소정의 장소를 연결하는 통화장치의 작동상태는 양호하여야 한다. 다만, 카 내에 조작반이 없는 화물용\n엘리베이터의 경우에는 그러하지 아니하다.”\n① 카 내와 외부의 소정의 장소를 연결하는 통화장치는 경비실 이외에도 중앙관리실이나 전기실 또는 유지보수업체 사무실\n등에 이중으로 설치하여야 한다.\n② 카 내와의 통화장치를 경비실에만 설치하는 경우에는 카 내에서 호출이 있을 때 외부에서 쉽게 알 수 있도록 버저와\n경광등이 경비실 외부 가까이 또는 기준층 승강장에 설치되어 있어야 하고, 작동상태는 양호하여야 한다.\n[로프식]\n4.1.6 중앙관리실 또는 경비실 등에서 하는 검사\n비상용 엘리베이터의 경우에는 비상용으로 사용되는 장치(호출스위치․비상운전등 및 통화장치)가 있어야 하고, 작동상"}, {"s": 0.1, "id": "16.3.1", "e": "1992-07-01", "x": "2013-09-15", "t": "[1992년 7월 1일 ~ 2013년 9월 15일 이전 건축허가분 종전기준 (구 4.1.2(5))]\n4.1.2(5) 외부와 연결하는 통화장치의 작동상태는 양호하여야 한다. 다만, 카 내에 조작반이 없는 화물용 엘리베이터의 경우에는\n그러하지 아니하다.\n16.3.2 기계실 또는 비상구출운전을 위한 장소에는 카내와 통화할 수 있도록 8.10.4에서"}]}, {"n": 37, "d": "1998-05-09", "ref": "3.2.2(2)", "t": "피트 바닥하부는 거실 또는 여러사람이 출임하는 통로 등으로 사용하지 않아야 한다. 다만, 피트 바닥하부를 거실 등으로 사용할 경우에는 피트 바닥을 2중슬라브로 하여야 한다.", "hyd": true, "c": [{"s": 0.37, "id": "6.5.4", "e": "1997-08-18", "x": "2013-09-15", "t": "[1997년 8월 18일 ~ 2013년 9월 15일 이전 건축허가분 종전기준 (구 3.1.3(11)/3.2.2(2))]\n[로프식]\n3.1.3(11) 피트 바닥하부는 거실 또는 여러 사람이 출입하는 통로 등으로 사용하지 않아야 한다. 다만, 사용할 경우에는 피트 바닥을 2중슬라브로 하고, 균형추쪽에도 비상정지장치를 설치하거나 균형추쪽 직하부에 두꺼운 벽을 설치하여야 한다.\n[유압식]\n3.2.2(2) 피트 바닥하부는 거실 또는 여러 사람이 출입하는 통로 등으로 사용하지 않아야 한다. 다만, 사용할 경우에는 피트 바닥을 2중슬라브로 하여야 한다."}, {"s": 0.1, "id": "6.6.1", "e": "1997-08-18", "x": "2013-09-15", "t": "[1997년 8월 18일 ~ 2013년 9월 15일 이전 건축허가분 종전기준]\n[로프식]\n3.1.5(2) 바닥면적은 승강로 수평투영면적의 2배 이상으로 하여야 한다. 다만, 기기의 배치 및 관리에 지장이 없는 경우에는\n그러하지 아니하다."}, {"s": 0.1, "id": "5.6.2", "e": "1997-08-18", "x": "2013-09-15", "t": "3.1.1(1) 승강로의 구조 및 설비\n① 승강로는 견고한 벽, 천장 및 바닥으로 구획하여야 하고 그 내부에는 엘리베이터와 관계없는 배관, 배선 또는 기타 이질설비를 설치하지 않아야 한다.\n4.1.2(1) 승강로의 구조 및 설비는 견고하고 양호한 상태에 있어야 한다."}]}, {"n": 38, "d": "1998-05-09", "ref": "3.2.5(3)", "t": "기계실 바닥은 작동유가 침투하지 않도록 콘크리트·모르타르 등으로 시공하여야 한다. ", "hyd": true, "c": [{"s": 0.12, "id": "1.3.5-다", "e": "1997-08-18", "x": "2013-09-15", "t": "3.1.1(1) 승강로는 견고한 벽, 천장 및 바닥으로 구획하여야 한다."}, {"s": 0.1, "id": "7.7.3.1", "e": "1992-07-01", "x": "1997-08-18", "t": "4.1.2(3) 잠금장치의 작동상태는 양호하여야 한다."}, {"s": 0.1, "id": "12.4.2.3.1", "e": "1992-07-01", "x": "1997-08-18", "t": "4.1.1(5) 전자브레이크의 작동상태는 양호하여야 한다."}]}, {"n": 39, "d": "1998-05-09", "ref": "3.2.5(4)", "t": "기름탱크 전용량의 작동유를 수용할 수 있도록 유압파워유니트의 주위에 기름방벽을 설치하거나 문턱을 높게 하여야 한다.", "hyd": true, "c": [{"s": 0.12, "id": "5.6.1.2", "e": "1997-08-18", "x": "2013-09-15", "t": "3.1.1(6) 균형추의 운동구역에서 사람이 접근할 수 있는 부분에는 방호판을 설치하여야 한다."}, {"s": 0.12, "id": "5.6.1.1", "e": "1997-08-18", "x": "2013-09-15", "t": "3.1.1(6) 균형추의 운동구역에서 사람이 접근할 수 있는 부분에는 방호판을 설치하여야 한다."}, {"s": 0.12, "id": "1.3.5-나", "e": "1997-08-18", "x": "2013-09-15", "t": "3.1.1(6) 균형추의 운동구역에서 사람이 접근할 수 있는 부분에는 방호판을 설치하여야 한다."}]}, {"n": 40, "d": "1998-05-09", "ref": "3.2.6(7)", "t": "압력배관이 파손되었을 때 기름의 누설에 의한 카의 하강을 제지하는 장치. 다만, 조속기 및 비상정지장치가 설치된 경우에는 그러하지 아니하다.", "hyd": true, "c": [{"s": 0.15, "id": "13.3.5.2.2", "e": "1992-07-01", "x": "2013-09-15", "t": "[1992년 7월 1일 ~ 2013년 9월 15일 이전 건축허가분 종전기준]\n[유압식]\n3.2.6(2) 동력이 차단되었을 때 유압잭 내의 기름의 역류에 의한 카의 하강을 제지하는 장치\n4.2.1(3) 유압파워유니트?압력배관 및 고압고무호스\n④ 유압파워유니트의 체크밸브의 작동상태는 양호하여야 한다."}, {"s": 0.15, "id": "13.3.5.2.1", "e": "1992-07-01", "x": "2013-09-15", "t": "[1992년 7월 1일 ~ 2013년 9월 15일 이전 건축허가분 종전기준]\n[유압식]\n3.2.6(2) 동력이 차단되었을 때 유압잭 내의 기름의 역류에 의한 카의 하강을 제지하는 장치\n4.2.1(3) 유압파워유니트?압력배관 및 고압고무호스\n④ 유압파워유니트의 체크밸브의 작동상태는 양호하여야 한다."}, {"s": 0.12, "id": "16.3", "e": "1992-07-01", "x": "2013-09-15", "t": "[1992년 7월 1일 ~ 2013년 9월 15일 이전 건축허가분 종전기준 (구 3.1.6(10))]\n3.1.6(10) 정전 등의 비상시에 카 내에서 외부로 통화할 수 있는 장치, 다만, 카 내에 조작반이 없는 화물용 엘리베이터의 경우에는\n그러하지 아니하다."}]}, {"n": 41, "d": "1998-05-09", "ref": "3.2.6(12)", "t": "", "hyd": true, "c": []}, {"n": 42, "d": "1998-05-09", "ref": "3.3.2(9)", "t": "승강로의 상하부의 좌우에 고정되어 디딤판이 들려지는 상태에서의 운행이탈을 감지하여 디딤판의 승강을 제어하여 정지시키는 장치. 다만, 수평보행기의 경우에는 그러하지 아니하다.", "hyd": false, "c": [{"s": 0.14, "id": "7.3.2", "e": "1999-09-03", "x": "2013-09-15", "t": "3.1.2(5) 승강장문의 유효개구부의 폭은 0.8m 이상, 유효개구부의 높이는 2m 이상이어야 한다. 다만, 화물용 엘리베이터의 경우에는 그러하지 아니하다.\n4.1.2(3) 승강장문의 개폐상태 및 잠금장치의 작동상태는 양호하여야 한다."}, {"s": 0.14, "id": "7.3.1", "e": "1999-09-03", "x": "2013-09-15", "t": "3.1.2(5) 승강장문의 유효개구부의 폭은 0.8m 이상, 유효개구부의 높이는 2m 이상이어야 한다. 다만, 화물용 엘리베이터의 경우에는 그러하지 아니하다.\n4.1.2(3) 승강장문의 개폐상태 및 잠금장치의 작동상태는 양호하여야 한다."}, {"s": 0.12, "id": "6.6.1", "e": "1997-08-18", "x": "2013-09-15", "t": "[1997년 8월 18일 ~ 2013년 9월 15일 이전 건축허가분 종전기준]\n[로프식]\n3.1.5(2) 바닥면적은 승강로 수평투영면적의 2배 이상으로 하여야 한다. 다만, 기기의 배치 및 관리에 지장이 없는 경우에는\n그러하지 아니하다."}]}, {"n": 43, "d": "1998-05-09", "ref": "3.4.5(6)2", "t": "기계실 출입구의 소재가 명확하지 않을 경우에는 출입구의 위치와 기계실로 가는 경로를 최상층 출입구 부근에 명시하여야 한다.", "hyd": false, "c": [{"s": 0.11, "id": "6.6.3.2.4", "e": "1992-07-01", "x": "1997-08-18", "t": "[1992년 7월 1일 ~ 1997년 8월 18일 이전 건축허가분 종전기준 (구 3.1.5(9))]\n3.1.5(9) 기계실로 가는 복도, 계단, 출입문 등은 유지관리상 지장이 없어야 한다.\n출입구의 자물쇠의 시건장치는 양호하여야 한다."}, {"s": 0.11, "id": "6.3.2", "e": "1992-07-01", "x": "1997-08-18", "t": "[1992년 7월 1일 ~ 1997년 8월 18일 이전 건축허가분 종전기준 (구 3.1.5(9))]\n3.1.5(9) 기계실로 가는 복도, 계단, 출입문 등은 유지관리상 지장이 없어야 한다.\n출입구의 자물쇠의 시건장치는 양호하여야 한다."}, {"s": 0.1, "id": "6.4.7.2", "e": "1997-08-18", "x": "2013-09-15", "t": "[1997년 8월 18일 ~ 2013년 9월 15일 이전 건축허가분 종전기준 (구 3.1.5(9))]\n3.1.5(9) 기계실로 가는 복도, 계단, 출입문 등은 유지관리상 지장이 없어야 한다.” 및 “출입구의 자물쇠의 시건장치는 양호하여야\n한다.\n4.1.1(1) 기계실의 구조 및 설비\n④ 출입구의 자물쇠의 잠금장치는 양호하여야 한다."}]}, {"n": 44, "d": "1998-05-09", "ref": "3.4.5(6)3", "t": "기계실로 가는 천장에 개구부를 설치할 경우에는 개구부의 폭과 높이는 각각 60cm 이상으로 하고, 기계실 출입구에 가깝게 설치하여야 하며, 천장 위를 통하는 부분은 발이 빠지지 않도록 견고하게 보강하여야 한다.", "hyd": false, "c": [{"s": 0.15, "id": "6.3.2", "e": "2003-06-18", "x": "2013-09-15", "t": "[2003년 6월 18일 ~ 2013년 9월 15일 이전 건축허가분 종전기준 (구 3.1.5(9)③)]\n3.1.5(9)③ 출입문은 보수관리 및 방재를 고려하여 잠금장치가 있는 금속제 문을 설치하여야 하고, 유효 개구부의 폭 0.7m 이상, 유효 개구부의 높이 1.8m 이상으로 하여야 하며, 출입문이 외기에 접하는 경우에는 빗물이 침입하지 않는 구조로 하여야 하고, 부식이 없어야 한다."}, {"s": 0.12, "id": "1.2.2.1-마", "e": "2004-12-01", "x": "2013-09-15", "t": "3.1.5(6)② 자연환기하는 경우에 환기창 또는 루버 등의 합산한 크기는 기계실 바닥면적의 1/20 이상이어야 하고, 실온은 원칙적으로 40℃ 이하를 유지할 수 있어야 한다. 환기창 크기 부족 시 강제환기장치 또는 공조장치를 설치하여야 하며, 루버를 설치하는 경우에는 눈·비가 유입되거나 동절기에 실온이 내려가지 않도록 덧창을 설치하여야 한다.\n4.1.1(1)③ 환기는 적절하여야 하며, 실온은 원칙적으로 40℃ 이하를 유지하도록 하여야 한다."}, {"s": 0.11, "id": "6.6.3.2.4", "e": "2003-06-18", "x": "2013-09-15", "t": "[2003년 6월 18일 ~ 2013년 9월 15일 이전 건축허가분 종전기준 (구 3.1.5(9)②)]\n3.1.5(9)② 계단은 불연재료로 설치하여야 하고, 발판·난간 및 경사가 있어야 하며, 계단의 폭은 0.7m 이상이어야 한다. 다만, 위의 조건을 만족하는 사다리(원형사다리 포함)는 계단으로 간주할 수 있으며, 기계실 바닥까지의 높이가 1.5m 미만인 경우에는 수직사다리를 설치할 수 있다. 또한, 기계실 바닥의 높이차가 45㎝를 초과하는 경우에도 계단 또는 사다리를 설치하여야 한다."}]}, {"n": 45, "d": "1998-05-09", "ref": "3.4.5(6)4", "t": "기계실의 출입구 또는 개구부의 높이가 바닥면보다 3m 이상 높은 위치에 있을 경우에는 사다리 등을 고정설치하여야 하며, 옥외 사다리 등에서 추락의 위험이 있을 경우에는 추락방지를 위한 보호조치를 하여야 한다.", "hyd": false, "c": [{"s": 0.12, "id": "1.2.2.1-바", "e": "1997-08-18", "x": "2013-09-15", "t": "3.1.5(6)① 조명스위치는 출입구 가까이에 설치하고, 조명전원은 엘리베이터의 제어전원과 별도로 분리하여야 하며, 조도는 기기가 배치된 바닥면에서 100Lux 이상이어야 한다.\n4.1.1(1)③ 유지관리에 지장이 없도록 기계실의 조도는 기기가 배치된 바닥면에서 100Lux 이상이어야 한다."}, {"s": 0.12, "id": "1.2.2.1-아", "e": "1997-08-18", "x": "2013-09-15", "t": "3.1.5(5) 기계실 천장에는 기기를 양정하기 위한 고리 등을 설치하여야 한다.\n※ 유압식 엘리베이터 제외"}, {"s": 0.12, "id": "6.6.3.2.4", "e": "2003-06-18", "x": "2013-09-15", "t": "[2003년 6월 18일 ~ 2013년 9월 15일 이전 건축허가분 종전기준 (구 3.1.5(9)②)]\n3.1.5(9)② 계단은 불연재료로 설치하여야 하고, 발판·난간 및 경사가 있어야 하며, 계단의 폭은 0.7m 이상이어야 한다. 다만, 위의 조건을 만족하는 사다리(원형사다리 포함)는 계단으로 간주할 수 있으며, 기계실 바닥까지의 높이가 1.5m 미만인 경우에는 수직사다리를 설치할 수 있다. 또한, 기계실 바닥의 높이차가 45㎝를 초과하는 경우에도 계단 또는 사다리를 설치하여야 한다."}]}, {"n": 46, "d": "1998-05-09", "ref": "3.4.6(7)", "t": "카 내 및 출입구의 보기 쉬운 위치에 적재하중, 사람의 탑승금지 등의 주의사항을 명시한 표지", "hyd": false, "c": [{"s": 0.09, "id": "8.2.3.2", "e": "1992-07-01", "x": "2013-09-15", "t": "[1992년 7월 1일 ~ 2013년 9월 15일 이전 건축허가분 종전기준 (구 4.1.2(2))]\n4.1.2(2) 용도 또는 승강기 종류, 적재하중 또는 최대정원의 표시가 보기 쉬운 위치에 있고, 그 기재내용이 적정하여야 한다."}, {"s": 0.04, "id": "15.2.2", "e": "1997-08-18", "x": "2013-09-15", "t": "3.1.8(1) 카 내에는 정격하중, 최대탑승인원 등이 표시되어야 한다.\n4.1.3(8) 카 내 표시의 설치상태는 견고하고, 양호한 상태에 있어야 한다."}, {"s": 0.04, "id": "15.2.1", "e": "1997-08-18", "x": "2013-09-15", "t": "3.1.8(1) 카 내에는 정격하중, 최대탑승인원 등이 표시되어야 한다.\n4.1.3(8) 카 내 표시의 설치상태는 견고하고, 양호한 상태에 있어야 한다."}]}, {"n": 47, "d": "1998-05-09", "ref": "3.4.6(8)", "t": "1개층에 있어서 2개의 출입구가 설치된 경우에는 출입구의 동시개방을 금지하기 위하여 출입구의 보기 쉬운 위치에 게시한 주의 표지", "hyd": false, "c": [{"s": 0.09, "id": "1.4.1-사", "e": "1997-08-18", "x": "2013-09-15", "t": "3.1.3(3) 카의 출입구 하부에는 에이프런을 설치하여야 한다.\n4.1.3(1) 카의 구조 및 설비는 견고하고 양호한 상태에 있어야 한다."}, {"s": 0.08, "id": "8.2.3.2", "e": "1992-07-01", "x": "2013-09-15", "t": "[1992년 7월 1일 ~ 2013년 9월 15일 이전 건축허가분 종전기준 (구 4.1.2(2))]\n4.1.2(2) 용도 또는 승강기 종류, 적재하중 또는 최대정원의 표시가 보기 쉬운 위치에 있고, 그 기재내용이 적정하여야 한다."}, {"s": 0.07, "id": "9.5.3", "e": "1997-08-18", "x": "2013-09-15", "t": "[1997년 8월 18일 ~ 2013년 9월 15일 이전 건축허가분 종전기준]\n[로프식]\n3.1.6(11) 권동식 엘리베이터에 있어서 주로프가 이완된 경우에 동력을 자동적으로 차단하는 장치\n4.1.3(26) 권동식 엘리베이터에 있어서 주로프가 이완되는 경우에 안전스위치의 작동상태는 양호하여야 한다.\n[유압식]\n3.2.6(5) 전동기의 공전을 방지하기 위한 장치"}]}, {"n": 48, "d": "1998-05-09", "ref": "4.1.1(1)3", "t": "제어반상의 각 스위치의 접점 및 작동상태는 양호하여야 한다.", "hyd": false, "c": [{"s": 0.38, "id": "7.7.3.1", "e": "1992-07-01", "x": "1997-08-18", "t": "4.1.2(3) 잠금장치의 작동상태는 양호하여야 한다."}, {"s": 0.35, "id": "1.3.1-다", "e": "1997-01-01", "x": "2013-09-15", "t": "4.1.4(16) 피트 정지스위치의 설치상
