<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>AI 되묻기 버튼 예시</title>
<style>
body{font:14px/1.55 'Malgun Gothic',sans-serif;margin:0;background:#eef1f5;color:#222}
.wrap{max-width:460px;margin:0 auto;padding:14px}
h1{font-size:15px;margin:6px 0 2px}.sub{font-size:12px;color:#666;margin-bottom:10px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{border:1px solid #cbd3dd;background:#fff;border-radius:16px;padding:5px 11px;font-size:12px;cursor:pointer}
.tabs button.on{background:#2563eb;color:#fff;border-color:#2563eb}
.chat{background:#fff;border-radius:14px;padding:12px;min-height:330px}
.u{background:#2563eb;color:#fff;border-radius:14px 14px 2px 14px;padding:8px 12px;margin:0 0 10px auto;max-width:85%;width:fit-content}
.a{background:#f3f5f8;border-radius:14px 14px 14px 2px;padding:10px 12px;margin:0 0 10px;max-width:92%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid #2563eb;color:#2563eb;background:#fff;border-radius:16px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip:hover{background:#eff5ff}
.chip.skip{border-color:#bbb;color:#666}
.note{font-size:11px;color:#777;margin-top:6px}
.sel{background:#e8f0fe;border-radius:14px 14px 2px 14px;padding:6px 12px;margin:0 0 10px auto;max-width:85%;width:fit-content;font-size:13px}
.legend{margin-top:12px;background:#fffbe6;border-radius:10px;padding:10px 12px;font-size:12px}
.legend b{display:block;margin-bottom:3px}
</style>
<div class=wrap>
<h1>AI 되묻기 버튼 예시</h1>
<div class=sub>애매할 때만 버튼이 나옵니다. 버튼을 안 눌러도 되고, 직접 입력해도 됩니다.</div>
<div class=tabs id=tabs></div>
<div class=chat id=chat></div>
<div class=legend>
<b>동작 원칙</b>
· 질문이 명확하면 버튼 없이 바로 답변 (지금과 동일)<br>
· 갈림길이 2개 이상이고 답이 크게 달라질 때만 표시, 한 번에 한 번만<br>
· 선택지는 AI가 앱 자료에서 찾은 후보 + "그냥 전체로 답변" 항상 포함<br>
· 선택 결과는 현장 용어 사전의 학습 신호로 쌓임 (예: 인터폰 → 피트가 많이 선택됨)
</div></div>
<script>
const S=[
{t:'인터폰 (위치 불명확)',q:'인터폰 없으면 지적이야?',ask:'"인터폰"은 어느 쪽을 말씀하시나요? 위치에 따라 기준이 달라요.',chips:['피트','카 상부','기계실(소방 시 통화)','건물 측 연결'],ans:{'피트':'피트 비상통화장치: 갇힌 사람이 빠져나올 방법이 없는 경우 설치 대상 [별표22 6.1.6]. 설치된 경우 피난공간에서 조작 가능한지 확인 [1.2.1.5-가] …','카 상부':'카 상부 비상통화장치: MR은 구출구로 대체 가능, MRL은 설치 필요 여부 확인 …','기계실(소방 시 통화)':'소방운전 시 기계실 인터폰 통화 연결 기준 …','건물 측 연결':'비상통화장치 외부(건물 측) 연결 기준 …','전체로 답변':'피트·카 상부·기계실·건물 측 기준을 각각 구분해서 모두 안내 …'}},
{t:'조도 (측정 위치)',q:'조도 80lx 나오면 지적이야?',ask:'어디에서 측정한 값인가요? 기준이 달라요.',chips:['기계실 작업공간','기계실 이동 통로','승강로/피트','카 내·승강장'],ans:{'기계실 작업공간':'작업공간 바닥 200lx 이상 [6.1.4.2 가)] — 80lx는 미달 …','기계실 이동 통로':'이동 공간 바닥 50lx 이상 [6.1.4.2 나)] — 80lx는 충족 …','승강로/피트':'승강로 조명 기준 …','카 내·승강장':'카 내 조도 기준 …','전체로 답변':'위치별 기준을 모두 안내 …'}},
{t:'설치연도 없음 (종전/현행)',q:'문닫힘안전장치 센서 하나만 안되면 판정 어떻게 해?',ask:'적용 기준을 정하려면 시점이 필요해요. 건축허가(또는 검사기준 적용) 시점이 언제쯤인가요?',chips:['2019.3.28 이후','2013.9.15 ~ 2019.3.28','2013.9.15 이전','모르겠음'],ans:{'2019.3.28 이후':'현행 기준 적용. 멀티빔/접촉식 구분 및 표준화(23년 제2차) 안내 …','2013.9.15 ~ 2019.3.28':'종전 기준 가능성 — 종전 조문과 나란히 비교 …','2013.9.15 이전':'종전 기준 + 1997·1998 고시 참고 …','모르겠음':'시점별로 나눠서 모두 안내하고 건축허가일 확인 요청 …','전체로 답변':'시점별 구분 안내 …'}}
];
let cur=0;const $=id=>document.getElementById(id);
function tabs(){ $('tabs').innerHTML=S.map((s,i)=>`<button class="${i==cur?'on':''}" onclick="go(${i})">${s.t}</button>`).join('') }
function go(i){cur=i;tabs();render()}
function render(pick){
 const s=S[cur];let h=`<div class=u>${s.q}</div><div class=a>${s.ask}<div class=chips>`;
 if(pick){h=`<div class=u>${s.q}</div><div class=a>${s.ask}</div><div class=sel>${pick}</div><div class=a>${s.ans[pick]}<div class=note>선택하신 내용을 기준으로 답변했어요. 다른 쪽이 궁금하면 직접 이어서 물어보세요.</div></div>`;$('chat').innerHTML=h;return}
 h+=s.chips.map(c=>`<button class=chip onclick="render('${c}')">${c}</button>`).join('')+`<button class="chip skip" onclick="render('전체로 답변')">그냥 전체로 답변</button></div><div class=note>버튼 없이 직접 입력해도 됩니다</div></div>`;
 $('chat').innerHTML=h}
go(0)
</script>
