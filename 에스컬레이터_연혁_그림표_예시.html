스컬레이터 또는 무빙워크 출입구 근처의 주의표시]", "old": "[그림 9. 에스컬레이터 또는 무빙워크 출입구 근처의 주의표시]"},DATA=[{"type": "current", "eff": "2022-03-02", "exp": null, "text": "6.1.2.1 주의표시를 위한 표시판 또는 표지는 견고한 재질로 만들어야 하며, 승강장에서 잘 보이는 곳에 확실히 부착되어야 한다.\n주의표시는 80 ㎜ × 100 ㎜ 이상의 크기로 그림과 같이 표시되어야 한다.\n비고 상기의 주의표시이외에 부속서 Ⅴ의 주의표시를 추가로 부착할 수 있다.", "img": "cur"}, {"type": "old", "eff": "2013-09-15", "exp": "2022-03-01", "text": "6.2.1 주의표시를 위한 표시판 또는 표지는 견고한 재질로 만들어야 하며, 승강장에서 잘 보이는 곳에 확실히 부착되어야 한다. 주의표시는 80 mm × 100 mm 이상의 크기로 그림 9와 같이 표시되어야 한다.", "img": "old"}, {"type": "old", "eff": "2009-11-24", "exp": "2013-09-14", "text": "4.3.2(21) 이용자의 주의표시는 다음 기준에 적합하여야 한다.\n① 주의표시를 위한 표시판 또는 표지는 견고한 재질로 만들어야 하며, 승강장에서 잘 보이는 곳에 확실히 부착하여야 한다.\n② 주의표시는 80mm × 100mm 이상의 크기로 <그림 5>와 같이 표시하여야 한다.\n③ 삭제", "img": null}, {"type": "old", "eff": "2008-11-07", "exp": "2009-11-23", "text": "4.3.2(21) 승강장의 주의표시판은 다음 기준에 적합하여야 한다.\n① 주의표지판은 견고한 재질로 만들어야 하며, 잘 보이는 곳에 확실히 부착하여야 한다.\n② 주의표시는 80mm × 100mm 이상의 크기로 <그림 5>와 같이 표시하여야 한다.\n③ 주의표지판에는 “어린이는 반드시 잡고 탈 것”, “애완동물은 반드시 안고 탈 것”, “몸은 주행방향 쪽을 향하고, 발을 바깥쪽으로 내밀지 말 것”, “핸드레일을 잡고 탈 것”이라는 의미를 반드시 포함하여야 하며, “신발을 신은 상태에서만 탈 것”, “크고 무거운 짐을 운반하지 말 것”, “유모차나 손수레를 싣지 말 것”\n다만, 에스컬레이터 탑재를 위하여 구름 및 전도방지를 위한 제동장치와 걸림 홈이 설치된 전용 손수레를 사용하며 경사각이 25도 이하이고 상·하 수평스텝 이 4스텝 이상 (1 스텝 0.4m 이상), 주행속도가 30m/min 이하이고 비상정지버튼 스위치가 콤에서 각각 2m이내의 출구지역에 있어야 하며, 출구지역 승강장 공간 5m 이상, 콤의 경사도가 19도 이하, 에스컬레이터 스텝이 트롤리(카트)보다 최소 0.4m 이상의 여유를 확보하였을 경우에는 “유모차나 손수레를 싣지 말 것”이라는 항목의 적용을 제외한다, 수평보행기는 제외) 이라는 의미를 부가적으로 포함할 수 있다.", "img": null}, {"type": "old", "eff": "2001-06-18", "exp": "2008-11-06", "text": "4.3.2(21) 승강장의 주의표시판은 다음 기준에 적합하여야 한다.\n① 주의표지판은 견고한 재질로 만들어야 하며, 잘 보이는 곳에 확실히 부착하여야 한다.\n② 주의표지판은 국문으로 읽기 쉽게 표기하거나 크기 80mm×80mm 이상의 그림으로 <그림 2>와 같이 표시하여야 한다.\n③ 주의표지판에는 “어린이는 반드시 잡고 탈 것”, “애완동물은 반드시 안고 탈 것”, “몸은 주행방향 쪽을 향하고, 발을 바깥쪽으로 내밀지 말 것”, “핸드레일을 잡고 탈 것”이라는 의미를 반드시 포함하여야 하며, “신발을 신은 상태에서만 탈 것”, “크고 무거운 짐을 운반하지 말 것”, “유모차나 손수레를 싣지 말 것”\n다만, 에스컬레이터 탑재를 위하여 구름 및 전도방지를 위한 제동장치와 걸림 홈이 설치된 전용 손수레를 사용하며 경사각이 25도 이하이고 상·하 수평스텝 이 4스텝 이상 (1 스텝 0.4m 이상), 주행속도가 30m/min 이하이고 비상정지버튼스위치가 콤에서 각각 2m이내의 출구지역에 있어야 하며, 출구지역 승강장 공간 5m 이상, 콤의 경사도가 19도 이하, 에스컬레이터 스텝이 트롤리(카트)보다 최소 0.4m 이상의 여유를 확보하였을 경우에는 “유모차나 손수레를 싣지 말 것”이라는 항목의 적용을 제외한다, 수평보행기는 제외) 이라는 의미를 부가적으로 포함할 수 있다.\n<단서조항 적용은 2001년 7월 25일부터 시행 >\n< 2001년 6월 18일 이후 2001년 7월 25일 전까지의 종전 기준 - “주의표지판에는 “어린이는 반드시 잡고 탈 것”, “애완동물은 반드시 안고 탈 것”, “몸은 주행방향쪽을 향하고, 발을 바깥쪽으로 내밀지 말 것”, “핸드레일을 잡고 탈 것”이라는 의미를 반드시 포함하여야 하며, “신발을 신은 상태에서만 탈 것”, “크고 무거운 짐을 운반하지 말 것”, “유모차나 손수레를 싣지 말 것”\n다만, 에스컬레이터 탑재를 위하여 구름 및 전도방지를 위한 제동장치와 걸림 홈이 설치된 전용 손수레를 사용하며 경사각이 25도 이하이고 상ㆍ하 수평스텝 이 4스텝 이상 (1 스텝 0.4m 이상), 주행속도가 30m/min 이하이고 비상정지버튼 스위치가 콤에서 각각 2m이내의 출구지역에 있어야 하며, 출구지역 승강장 공간 5m 이상, 콤의 경사도가 19도 이하, 에스컬레이터 스텝이 트롤리(카트)보다 최소 0.4m 이상의 여유확보, 에스컬레이터 입구 및 출구 쪽에 안전원을 두었을 경우에는 그러하지 아니한다, 수평보행기는 제외) 이라는 의미를 부가적으로 포함할 수 있다.” >", "img": null}];
const day=d=>{const t=new Date(d);t.setDate(t.getDate()+1);return t.toISOString().slice(0,10)};
function app(v,ref){const f=v.eff?new Date(v.eff):null,t=v.exp?new Date(v.exp):null;return (!f||ref>=f)&&(!t||ref<=t)}
function show(k){document.getElementById('mi').src=IMG[k];document.getElementById('mod').style.display='flex'}

 const vs=DATA.slice().sort((a,b)=>(a.type=='current'?-1:b.type=='current'?1:(b.eff||'').localeCompare(a.eff||'')));
 const hit=vs.filter(v=>app(v,ref))[0];
 document.getElementById('view').innerHTML='<div class=box><h4>📎 참조 조문 연혁 (6개 조문 중 6.1.2.1)</h4><div class=ref>[별표24] 6.1.2.1</div>'+vs.map((v,i)=>{const on=v===hit;
  const label=v.type=='current'?'현행 · '+v.eff+' 시행':v.eff?v.eff+' 이후 건축허가분':'종전';
  const fig=v.img?'<div class=fig onclick="show(\''+v.img+'\')"><img src="'+IMG[v.img]+'"><span>🔍 표·그림 확대</span></div><div class=cap>'+CAP[v.img]+'</div>':'';
  return '<div class=row><div class=rail><div class="dot '+(on?'on':'')+'"></div>'+(i<vs.length-1?'<div class=line></div>':'')+'</div><div class=body><div class=lb><p class="'+(on?'on':'')+'">'+label+'</p>'+(on?'<span class=badge>📍 적용 중</span>':'')+'</div><p class="tx '+(on?'on':'')+'">'+v.text.replace(/</g,'&lt;')+'</p>'+fig+'</div></div>'}).join('')+'</div>';}
document.getElementById('pd').onchange=render;render();
</script></html>
